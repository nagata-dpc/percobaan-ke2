<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health Dashboard</title>
    <style>
        :root {
            --pink-primary: #ec4899;
            --pink-light: #fbcfe8;
            --pink-bg: #fdf2f8;
            --pink-dark: #be185d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--pink-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 550px; border-radius: 20px; border: 2px solid var(--pink-light); padding: 30px; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15); }
        .header-title { text-align: center; color: var(--pink-dark); margin-bottom: 20px; font-size: 22px; font-weight: bold; }
        .url-box { width: 100%; padding: 12px; border: 2px solid var(--pink-light); border-radius: 12px; margin-bottom: 25px; outline: none; font-family: monospace; }
        .grid-form { display: grid; grid-template-columns: 90px 1fr auto; gap: 15px; align-items: center; margin-bottom: 25px; }
        label { font-weight: bold; color: var(--pink-dark); font-size: 14px; }
        input[type="text"] { padding: 10px; border: 2px solid var(--pink-light); border-radius: 10px; outline: none; }
        .sensor-container { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background-color: #fff1f2; border: 2px solid var(--pink-light); border-radius: 12px; transition: background-color 0.3s; }
        .sensor-value { font-weight: bold; font-family: monospace; color: var(--pink-dark); font-size: 16px; }
        .status-badge { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; color: white; background-color: #10b981; text-align: center; min-width: 110px; }
        .btn { background-color: var(--pink-primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: var(--pink-dark); }
        .btn-bluetooth { background-color: #6366f1; }
        .table-wrapper { border-radius: 12px; overflow: hidden; border: 2px solid var(--pink-light); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        th { background-color: #fce7f3; color: var(--pink-dark); padding: 12px; font-weight: bold; border-bottom: 2px solid var(--pink-light); }
        td { padding: 12px; background-color: white; color: #4b5563; border-bottom: 1px solid #f3f4f6; }
        .actions-footer { display: flex; justify-content: flex-end; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">🌸 Smart Health Dashboard</h1>
        
        <input type="text" id="esp-url" value="https://111.111.11.11" class="url-box">

        <div class="grid-form">
            <label for="input-nama">Nama Psn</label>
            <input type="text" id="input-nama" placeholder="Nama pasien...">
            <button id="btn-bluetooth" class="btn btn-bluetooth">Connect Bluetooth</button>

            <label>Heart Rate</label>
            <div id="box-hr" class="sensor-container">
                <span id="val-hr" class="sensor-value">75 bpm</span>
                <span style="color: var(--pink-primary);">♥</span>
            </div>
            <span id="badge-hr" class="status-badge">SEHAT 💖</span>

            <label>Suhu Tubuh</label>
            <div id="box-temp" class="sensor-container">
                <span id="val-temp" class="sensor-value">36.5 °C</span>
                <span>🌡️</span>
            </div>
            <button id="btn-save" class="btn">Save Data</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="border-right: 1px solid var(--pink-light); width: 20%;">Waktu</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 25%;">Nama</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 18%;">HR</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 18%;">Suhu</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr style="color: #d1d5db; font-weight: bold;">
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td>. . . .</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions-footer">
            <button id="btn-download" class="btn">Download Log (.CSV)</button>
        </div>
    </div>

    <script>
        let currentHR = 75;
        let currentTemp = 36.5;
        let savedData = [];
        let initialClear = true;

        // Fungsi pembantu untuk mendeteksi status berdasarkan angka sensor
        function hitungStatus(hr, temp) {
            // 1. Kritis
            if (hr > 115 || hr < 50 || temp > 38.0 || temp < 35.0) {
                return { text: "KRITIS 🚨", color: "#ef4444", bgColor: "#fee2e2" };
            }
            // 2. Kurang Sehat
            if ((hr > 95 && hr <= 115) || (hr >= 50 && hr < 60) || (temp > 37.2 && temp <= 38.0) || (temp >= 35.0 && temp < 36.1)) {
                return { text: "KRG SEHAT ⚠️", color: "#f59e0b", bgColor: "#fef3c7" };
            }
            // 3. Sehat / Normal
            return { text: "SEHAT 💖", color: "#10b981", bgColor: "#fff1f2" };
        }

        // Fungsi mengubah angka secara acak (Simulasi bervariasi)
        function perbaruiAngkaSensor() {
            const acak = Math.random();
            
            if (acak > 0.70) { 
                // 30% peluang memunculkan kondisi Kurang Sehat
                currentHR = Math.floor(Math.random() * (112 - 98 + 1)) + 98;
                currentTemp = parseFloat((Math.random() * (37.9 - 37.3) + 37.3).toFixed(1));
            } else if (acak > 0.55) {
                // 15% peluang memunculkan kondisi Kritis
                currentHR = Math.floor(Math.random() * (130 - 116 + 1)) + 116;
                currentTemp = parseFloat((Math.random() * (39.5 - 38.1) + 38.1).toFixed(1));
            } else {
                // 55% peluang memunculkan kondisi Sehat / Normal
                currentHR = Math.floor(Math.random() * (95 - 65 + 1)) + 65;
                currentTemp = parseFloat((Math.random() * (37.1 - 36.2) + 36.2).toFixed(1));
            }

            // Pasang ke komponen teks
            document.getElementById('val-hr').innerText = currentHR + " bpm";
            document.getElementById('val-temp').innerText = currentTemp + " °C";

            // Ubah badge status dan background kotak sensor secara dinamis
            const analisis = hitungStatus(currentHR, currentTemp);
            const badge = document.getElementById('badge-hr');
            
            badge.innerText = analisis.text;
            badge.style.backgroundColor = analisis.color;
            
            document.getElementById('box-hr').style.backgroundColor = analisis.bgColor;
            document.getElementById('box-temp').style.backgroundColor = analisis.bgColor;
        }

        // Tombol Simpan Data ke dalam tabel log
        document.getElementById('btn-save').addEventListener('click', function() {
            const namaInput = document.getElementById('input-nama').value.trim() || "Pasien Anonim";
            const analisis = hitungStatus(currentHR, currentTemp);

            // Ambil waktu jam dan menit real-time asli dari komputer/HP user saat ini
            const sekarang = new Date();
            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const waktuSekarang = jam + ":" + menit;

            if (initialClear) {
                document.getElementById('table-body').innerHTML = '';
                initialClear = false;
            }

            // Masukkan data ke array untuk file download
            savedData.push({ 
                waktu: waktuSekarang, 
                nama: namaInput, 
                hr: currentHR, 
                temp: currentTemp, 
                status: analisis.text 
            });

            // Tambahkan baris baru ke tabel fisik
            const baris = document.createElement('tr');
            baris.innerHTML = `
                <td style="border-right: 1px solid #f3f4f6; font-family: monospace; color: #6b7280;">${waktuSekarang}</td>
                <td style="border-right: 1px solid #f3f4f6; font-weight: bold;">${namaInput}</td>
                <td style="border-right: 1px solid #f3f4f6; font-family: monospace;">${currentHR} bpm</td>
                <td style="border-right: 1px solid #f3f4f6; font-family: monospace;">${currentTemp} °C</td>
                <td style="font-weight: bold; color: ${analisis.color};">${analisis.text}</td>
            `;
            document.getElementById('table-body').appendChild(baris);
        });

        // Tombol Download CSV
        document.getElementById('btn-download').addEventListener('click', function() {
            if (savedData.length === 0) {
                alert("Data kosong! Silakan simpan data terlebih dahulu.");
                return;
            }
            let csv = "Waktu,Nama Pasien,Heart Rate,Suhu Tubuh,Status\n";
            savedData.forEach(function(d) {
