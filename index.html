<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health Dashboard - Premium Pink Edition</title>
    <style>
        :root {
            --pink-primary: #ec4899;
            --pink-light: #fbcfe8;
            --pink-bg: #fdf2f8;
            --pink-dark: #be185d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.15);
            border: 2px solid var(--pink-light);
            padding: 35px;
        }

        .header-title {
            text-align: center;
            color: var(--pink-dark);
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .url-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--pink-light);
            border-radius: 12px;
            background-color: #fffafc;
            color: var(--pink-dark);
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 25px;
            outline: none;
        }

        .grid-form {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 18px 12px;
            align-items: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 700;
            color: var(--pink-dark);
            font-size: 14px;
        }

        input[type="text"] {
            padding: 11px 14px;
            border: 2px solid var(--pink-light);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        .sensor-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: #fff1f2;
            border: 2px solid var(--pink-light);
            border-radius: 12px;
        }

        .sensor-value {
            font-weight: 800;
            font-family: monospace;
            color: var(--pink-dark);
            font-size: 16px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            background-color: #9ca3af;
            text-align: center;
            display: inline-block;
            min-width: 100px;
        }

        .bg-normal { background-color: #fff1f2; border-color: var(--pink-light); }
        .bg-warning { background-color: #fef3c7; border-color: #fde68a; }
        .bg-danger { background-color: #fee2e2; border-color: #fca5a5; }

        .badge-normal { background-color: var(--success-color); }
        .badge-warning { background-color: var(--warning-color); }
        .badge-danger { background-color: var(--danger-color); }

        .btn {
            background-color: var(--pink-primary);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(236, 72, 153, 0.2);
        }

        .btn:hover {
            background-color: var(--pink-dark);
        }

        .btn-bluetooth {
            background-color: #6366f1;
        }

        .table-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--pink-light);
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: #fce7f3;
            color: var(--pink-dark);
            padding: 14px 10px;
            font-weight: 700;
            border-bottom: 2px solid var(--pink-light);
        }

        td {
            padding: 12px 10px;
            background-color: white;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
        }

        .table-status {
            font-weight: 700;
            font-size: 12px;
        }

        .text-success { color: var(--success-color); }
        .text-warning { color: var(--warning-color); }
        .text-danger { color: var(--danger-color); }

        .actions-footer {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">🌸 Smart Health Dashboard</h1>
        
        <input type="text" id="esp-url" value="https://111.111.11.11" class="url-box">

        <div class="grid-form">
            <label for="input-nama">Nama Psn</label>
            <input type="text" id="input-nama" placeholder="Nama pasien...">
            <button id="btn-bluetooth" class="btn btn-bluetooth">Connect Bluetooth</button>

            <label>Heart Rate</label>
            <div id="container-hr" class="sensor-container">
                <span id="val-hr" class="sensor-value">-- bpm</span>
                <span class="heart-icon" style="color: var(--pink-primary); font-size: 18px;">♥</span>
            </div>
            <span id="badge-hr" class="status-badge">No Data</span>

            <label>Suhu Tubuh</label>
            <div id="container-temp" class="sensor-container">
                <span id="val-temp" class="sensor-value">-- °C</span>
                <span>🌡️</span>
            </div>
            <button id="btn-save" class="btn">Save Data</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="border-right: 1px solid var(--pink-light); width: 20%;">Waktu</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 25%;">Nama</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 18%;">HR</th>
                        <th style="border-right: 1px solid var(--pink-light); width: 18%;">Suhu</th>
                        <th style="width: 21%;">Keterangan</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr class="placeholder-text">
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td style="border-right: 1px solid #f3f4f6;">. . . .</td>
                        <td>. . . .</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions-footer">
            <button id="btn-download" class="btn">Download Log (.CSV)</button>
        </div>
    </div>

    <script>

            document.getElementById('val-hr').innerText = currentHR + " bpm";

            let txt = "Sehat 💖";
            let cls = "normal";
            let tCls = "text-success";

                txt = "Kritis 🚨";
                cls = "danger";
                tCls = "text-danger";
            }

            const badgeHr = document.getElementById('badge-hr');
            badgeHr.innerText = txt;
            badgeHr.className = "status-badge badge-" + cls;

            document.getElementById('container-hr').className = "sensor-container bg-" + cls;
            document.getElementById('container-temp').className = "sensor-container bg-" + cls;
        }
